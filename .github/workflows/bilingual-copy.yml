name: Bilingual copy checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bilingual-copy:
    name: French and English regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out website
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate both languages and runtime behavior
        run: node --test tests/i18n.test.cjs
